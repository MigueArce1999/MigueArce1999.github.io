<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Claudia Patricia · Salón de belleza</title>
    <meta name="description" content="Reserva tu cita en Claudia Patricia, salón de belleza en Cartagena, Colombia." />

    <!-- PWA: instalable en el portal de empleadas (ver vite.config.ts → VitePWA). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#394638" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Safari (iOS) ignora <link rel="manifest">; estas etiquetas son la única forma de que
         una PWA agregada a la pantalla de inicio abra en modo standalone allí. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" (opaca) en vez de "black-translucent": con la translúcida, iOS dibuja el
         contenido de la página POR DEBAJO de la barra de estado/notch en modo standalone, así
         que el botón de menú del header quedaba tapado/pegado ahí arriba y era imposible de
         tocar — con la opaca, iOS reserva su propio espacio y el header nunca queda debajo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CP Equipo" />

    <style>
      /* Visible desde el primer byte. Si el salón tiene logo/splash (guardado en localStorage
         desde la visita anterior) se muestra solo esa imagen o video, sin spinner. Si no, va la
         marca GlowDesk con su spinner (.modo-glowdesk). React ajusta y la retira a los 3 s. */
      #pantalla-carga {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 28px;
        background: #e6e1d7;
        transition: opacity 0.25s ease;
      }
      #pantalla-carga-media > img,
      #pantalla-carga-media > video {
        display: block;
        width: min(280px, 70vw);
        max-height: 50vh;
        height: auto;
        object-fit: contain;
        /* El blanco de logos/videos subidos se funde con el fondo: sin "tarjeta" blanca. */
        mix-blend-mode: multiply;
      }
      #pantalla-carga .gd-marca {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }
      #pantalla-carga .gd-simbolo { width: 72px; height: 72px; object-fit: contain; }
      #pantalla-carga .gd-nombre { width: 150px; height: auto; }
      /* Spinner con los colores del símbolo de GlowDesk (verde menta → turquesa → petróleo). */
      #pantalla-carga .gd-aro {
        display: none;
        width: 34px;
        height: 34px;
        border-radius: 50%;
        background: conic-gradient(from 90deg, rgba(0, 209, 178, 0) 0deg, #9ff4b9 120deg, #13cfb7 250deg, #03302d 350deg, rgba(3, 48, 45, 0) 360deg);
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 4px), #000 calc(100% - 3px));
        animation: girar 0.9s linear infinite;
      }
      #pantalla-carga.modo-glowdesk .gd-aro { display: block; }
      @keyframes girar { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) {
        #pantalla-carga .gd-aro { animation-duration: 2.4s; }
      }
      #pantalla-carga.oculta { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="pantalla-carga" class="modo-glowdesk" aria-hidden="true">
      <div id="pantalla-carga-media">
        <span class="gd-marca">
          <img class="gd-simbolo" src="/glowdesk/simbolo.png" alt="" />
          <img class="gd-nombre" src="/glowdesk/glowdesk.svg" alt="GlowDesk" />
        </span>
      </div>
      <div class="gd-aro"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        // Logo/splash del salón guardado en la visita anterior; 'glowdesk' o vacío = marca GlowDesk.
        var url = null
        try { url = localStorage.getItem('glowdesk-splash-url') } catch (e) {}
        if (!url || url === 'glowdesk') return
        var pantalla = document.getElementById('pantalla-carga')
        var box = document.getElementById('pantalla-carga-media')
        if (!pantalla || !box) return
        var video = /\.(mp4|webm|mov)(\?|#|$)/i.test(url)
        var el
        if (video) {
          el = document.createElement('video')
          el.src = url
          el.muted = true
          el.autoplay = true
          el.setAttribute('playsinline', '')
        } else {
          el = document.createElement('img')
          el.src = url
          el.alt = ''
        }
        box.replaceChildren(el)
        pantalla.classList.remove('modo-glowdesk')
      })()
    </script>
  </body>
</html>
