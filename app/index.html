<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Claudia Patricia · Salón de belleza</title>
    <meta name="description" content="Reserva tu cita en Claudia Patricia, salón de belleza en Cartagena, Colombia." />

    <!-- PWA: instalable en el portal de empleadas (ver vite.config.ts → VitePWA). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#394638" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Safari (iOS) ignora <link rel="manifest">; estas etiquetas son la única forma de que
         una PWA agregada a la pantalla de inicio abra en modo standalone allí. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CP Equipo" />

    <style>
      /* Pantalla de carga con la identidad de marca, visible desde el primer byte — antes de
         que React monte — para que abrir la app instalada nunca se sienta como una pestaña de
         navegador en blanco. Se retira sola en cuanto main.tsx confirma que React ya pintó
         (ver el script inline más abajo). */
      #pantalla-carga {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #e6e1d7;
        transition: opacity 0.25s ease;
      }
      #pantalla-carga img { width: min(220px, 60vw); height: auto; }
      #pantalla-carga .aro {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 3px solid #39463833;
        border-top-color: #394638;
        animation: girar 0.8s linear infinite;
      }
      @keyframes girar { to { transform: rotate(360deg); } }
      #pantalla-carga.oculta { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="pantalla-carga" aria-hidden="true">
      <img src="/logo-claudia-patricia.png" alt="" />
      <div class="aro"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Retira la pantalla de carga en cuanto el DOM real de React reemplaza el placeholder
      // (nunca con un temporizador fijo, que se vería mal en un celular lento o en 3G).
      new MutationObserver((_muts, obs) => {
        if (document.getElementById('root')?.firstElementChild) {
          const p = document.getElementById('pantalla-carga')
          if (p) { p.classList.add('oculta'); setTimeout(() => p.remove(), 300) }
          obs.disconnect()
        }
      }).observe(document.getElementById('root'), { childList: true })
    </script>
  </body>
</html>
