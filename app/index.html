<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Claudia Patricia · Salón de belleza</title>
    <meta name="description" content="Reserva tu cita en Claudia Patricia, salón de belleza en Cartagena, Colombia." />

    <!-- PWA: instalable en el portal de empleadas (ver vite.config.ts → VitePWA). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#394638" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- Safari (iOS) ignora <link rel="manifest">; estas etiquetas son la única forma de que
         una PWA agregada a la pantalla de inicio abra en modo standalone allí. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- "default" (opaca) en vez de "black-translucent": con la translúcida, iOS dibuja el
         contenido de la página POR DEBAJO de la barra de estado/notch en modo standalone, así
         que el botón de menú del header quedaba tapado/pegado ahí arriba y era imposible de
         tocar — con la opaca, iOS reserva su propio espacio y el header nunca queda debajo. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="CP Equipo" />

    <style>
      /* Visible desde el primer byte. La URL sale de localStorage (visita anterior) o del
         logo por defecto. React la sostiene exactamente 3 segundos y luego la retira. */
      #pantalla-carga {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #e6e1d7;
        transition: opacity 0.25s ease;
      }
      #pantalla-carga img,
      #pantalla-carga video {
        width: min(280px, 70vw);
        max-height: 50vh;
        height: auto;
        border-radius: 16px;
        object-fit: contain;
      }
      #pantalla-carga .aro {
        width: 28px;
        height: 28px;
        border-radius: 999px;
        border: 3px solid #39463833;
        border-top-color: #394638;
        animation: girar 0.8s linear infinite;
      }
      @keyframes girar { to { transform: rotate(360deg); } }
      #pantalla-carga.oculta { opacity: 0; pointer-events: none; }
    </style>
  </head>
  <body>
    <div id="pantalla-carga" aria-hidden="true">
      <div id="pantalla-carga-media">
        <img src="/logo-claudia-patricia.png" alt="" />
      </div>
      <div class="aro"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        var def = '/logo-claudia-patricia.png'
        var url = def
        try { url = localStorage.getItem('glowdesk-splash-url') || def } catch (e) {}
        var box = document.getElementById('pantalla-carga-media')
        if (!box || url === def) return
        var video = /\.(mp4|webm|mov)(\?|#|$)/i.test(url)
        var el
        if (video) {
          el = document.createElement('video')
          el.src = url
          el.muted = true
          el.autoplay = true
          el.setAttribute('playsinline', '')
        } else {
          el = document.createElement('img')
          el.src = url
          el.alt = ''
        }
        box.replaceChildren(el)
      })()
    </script>
  </body>
</html>
